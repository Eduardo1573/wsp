<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Schedule — KBTU</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignores the manifest for home-screen icons and needs PNG, not SVG. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- Label shown under the icon on the home screen. -->
<meta name="apple-mobile-web-app-title" content="KBTU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── login ─────────────────────────────────────────────────────── -->
<main id="login" class="screen login" hidden>
  <div class="login-inner">
    <p class="eyebrow">KBTU</p>
    <h1 class="login-title">Your&nbsp;schedule,<br>without&nbsp;the&nbsp;portal.</h1>
    <form id="loginForm" class="login-form" autocomplete="on">
      <label class="field">
        <span>Username</span>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="check">
        <input id="remember" type="checkbox">
        <span>Stay signed in on this device</span>
      </label>
      <button id="loginBtn" class="btn-primary" type="submit">
        <span class="btn-label">Sign in</span>
      </button>
      <p id="loginError" class="error" role="alert" hidden></p>
    </form>
    <p class="fineprint">Credentials go straight to wsp.kbtu.kz through your relay and are never stored anywhere but this device.</p>
  </div>
</main>

<!-- ── app ───────────────────────────────────────────────────────── -->
<div id="app" class="screen" hidden>
 <section id="view-schedule" class="view">
  <header class="topbar">
    <div class="topbar-main">
      <p class="topbar-date" id="topDate">—</p>
      <h1 class="topbar-title" id="topTitle">Today</h1>
    </div>
    <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </header>

  <nav class="days" id="days" aria-label="Day"></nav>

  <p id="nextUp" class="nextup" hidden></p>

  <main class="timeline" id="timeline"></main>
 </section>

 <!-- ── notes ─────────────────────────────────────────────────────────────── -->
 <section id="view-notes" class="view" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <p class="topbar-date">Personal</p>
      <h1 class="topbar-title">Notes</h1>
    </div>
  </header>
  <main id="notesList" class="notes"></main>
 </section>

 <!-- ── journal ──────────────────────────────────────────────── -->
 <section id="view-journal" class="view" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <p class="topbar-date" id="journalTerm">—</p>
      <h1 class="topbar-title" id="journalTitle">Journal</h1>
    </div>
    <button id="journalBack" class="icon-btn" title="Back to subjects" aria-label="Back to subjects" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </header>

  <div id="subjectList" class="subjects"></div>

  <div id="subjectDetail" class="detail" hidden>
    <div id="detailSummary" class="summary"></div>
    <div id="detailRows" class="records"></div>
  </div>
 </section>

 <!-- ── attendance ───────────────────────────────────────────── -->
 <section id="view-attendance" class="view" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <p class="topbar-date" id="attendState">—</p>
      <h1 class="topbar-title">Attendance</h1>
    </div>
    <button id="attendRefresh" class="icon-btn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </header>
  <div id="attendList" class="attend"></div>
 </section>

 <!-- ── files ────────────────────────────────────────────────── -->
 <section id="view-files" class="view" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <p class="topbar-date" id="filesPath">—</p>
      <h1 class="topbar-title" id="filesTitle">Files</h1>
    </div>
    <button id="filesBack" class="icon-btn" title="Back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </header>
  <div id="filesList" class="files"></div>
 </section>

 <nav class="tabbar" role="tablist" aria-label="Sections">
   <button class="tab" data-tab="schedule" role="tab" aria-selected="true">
     <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
       <rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
     </svg>
     <span>Schedule</span>
   </button>
   <button class="tab" data-tab="journal" role="tab" aria-selected="false">
     <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
       <path d="M5 3.5h11a3 3 0 0 1 3 3v14H8a3 3 0 0 1-3-3z"/><path d="M9 8h7M9 12h7"/>
     </svg>
     <span>Journal</span>
   </button>
   <button class="tab" data-tab="notes" role="tab" aria-selected="false">
     <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
       <path d="M5 4.5h14v15H5z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
     </svg>
     <span>Notes</span>
   </button>
   <button class="tab" data-tab="attendance" role="tab" aria-selected="false">
     <span class="tab-icon">
       <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
         <path d="M9 11.5l2.2 2.2L15.5 9.4"/><circle cx="12" cy="12" r="8.6"/>
       </svg>
       <i id="attendBadge" class="badge" hidden></i>
     </span>
     <span>Attendance</span>
   </button>
   <button class="tab" data-tab="files" role="tab" aria-selected="false">
     <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
       <path d="M3.5 7.5a2 2 0 0 1 2-2h3.4l2 2.4h7.6a2 2 0 0 1 2 2v8.6a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
     </svg>
     <span>Files</span>
   </button>
 </nav>
</div>

<div id="boot" class="screen boot"><div class="spinner" aria-label="Loading"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
